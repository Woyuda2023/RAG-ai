server:
  port: 8080

spring:
  application:
    name: ai-code-assistant
  datasource:
    url: jdbc:mysql://localhost:3306/ai_code_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null

# MyBatis：下划线字段自动映射为驼峰属性
mybatis:
  configuration:
    map-underscore-to-camel-case: true

llm:
  # 云端大模型 API（OpenAI 兼容协议）。当前使用已验证可用的智谱 GLM 配置；
  # 切换通义千问只需改 base-url 为 https://dashscope.aliyuncs.com/compatible-mode/v1、
  # api-key 为 DashScope Key（sk- 开头）、model-name 为 qwen-plus/qwen-turbo/qwen-max。
  base-url: https://open.bigmodel.cn/api/paas/v4
  api-key: ${LLM_API_KEY:}
  model-name: glm-4.7-flash
  temperature: 0.2
  timeout: 120s
  max-retries: 2                     # 网络/瞬时错误自动重试次数
  max-tokens: 2048                   # 限制单次回复最大 token 用量，防止超限

assistant:
  agent:
    max-tool-rounds: 5                # 工具调用最大轮次，防止 Agent 死循环
    max-result-chars: 4000            # 工具返回结果超过该长度即截断，控制 LLM 上下文
    summarize-when-truncated: false   # 截断后是否调用 LLM 生成摘要（额外消耗 token）
    memory-window-size: 20            # 单会话保留的最大消息条数
    max-sessions: 100                 # 内存中保留的最大会话数
    system-prompt: |
      你是「AI 代码助手」，一个基于 Agent + Tool Calling 架构、面向开发人员的智能编程助手。
      你可以根据用户需求自主判断是否调用工具：读取源码文件、查询数据库表结构、生成代码、审查代码、编写单元测试、查询代码规范、校验代码格式。
      输出规范：
      1) 代码一律放在 Markdown 代码块中并标注语言（如 ```java）；
      2) 先给出结论再给细节，语言简洁；代码生成与单元测试任务只输出代码和必要说明，不输出无关内容；
      3) 代码审查任务输出结构化结论与问题清单；
      4) 回答用户问题时使用用户使用的语言。
  security:
    # 允许读取的源码根目录：仅允许读取这些目录内的相对路径文件（请按实际环境修改）
    allowed-source-roots:
      - /home/dev/projects
      # - /opt/app
    max-source-file-size-kb: 512      # 单个源码文件大小上限（KB）
    read-only-db: true                # 数据库工具只读（本实现仅查询 information_schema）
    injection-guard-enabled: true     # 提示注入防护开关
    max-file-lines: 2000              # 文件读取工具单次返回的最大行数
  logging:
    enabled: true                     # 记录模型调用日志到 MySQL
    max-log-chars: 6000               # 日志中请求/响应文本最大长度

logging:
  level:
    com.example.aicodeassistant: info
